<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>제휴모아 · JehyuMoa</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml" />

    <!-- 글꼴: Figma와 같은 Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    />

    <!-- React와 Babel 라이브러리 (README 개발 방식) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 실제 지도: Leaflet + OpenStreetMap (API 키 없이 사용) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- React가 이 div 안에 화면을 그립니다. -->
    <div id="root"></div>

    <!-- 로컬 설정 (config.example.js를 복사해 config.js로 만들어요 · 깃에는 안 올라가요) -->
    <script src="config.js" onerror="window.JEHYUMOA_CONFIG = window.JEHYUMOA_CONFIG || {}"></script>

    <!-- JSX 코드: Babel Standalone이 위에서부터 순서대로 실행해요. 앞 파일의 이름을 뒤 파일이 쓰므로 순서를 지켜 주세요. -->
    <!-- 1) 공통 · 데이터 -->
    <script type="text/babel" src="src/core.js"></script>
    <script type="text/babel" src="src/data/constants.js"></script>
    <script type="text/babel" src="src/data/stores.js"></script>
    <!-- 2) 도우미 -->
    <script type="text/babel" src="src/lib/storage.js"></script>
    <script type="text/babel" src="src/lib/geo.js"></script>
    <script type="text/babel" src="src/lib/condition.js"></script>
    <script type="text/babel" src="src/lib/hours.js"></script>
    <script type="text/babel" src="src/lib/search.js"></script>
    <script type="text/babel" src="src/lib/sort.js"></script>
    <script type="text/babel" src="src/lib/router.js"></script>
    <!-- 3) 컴포넌트 -->
    <script type="text/babel" src="src/components/common.js"></script>
    <script type="text/babel" src="src/components/SortMenu.js"></script>
    <script type="text/babel" src="src/components/ConditionModal.js"></script>
    <script type="text/babel" src="src/components/Splash.js"></script>
    <!-- 4) 화면 -->
    <script type="text/babel" src="src/screens/ListScreen.js"></script>
    <script type="text/babel" src="src/screens/FavoritesScreen.js"></script>
    <script type="text/babel" src="src/screens/MapScreen.js"></script>
    <script type="text/babel" src="src/screens/MyScreen.js"></script>
    <script type="text/babel" src="src/screens/DetailScreen.js"></script>
    <!-- 5) 앱 조립 · 라우팅 (마지막) -->
    <script type="text/babel" src="app.js"></script>
  </body>
</html>
